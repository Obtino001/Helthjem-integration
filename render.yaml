services:
  - type: web
    name: helthjem-shopify-carrier
    runtime: node
    plan: starter
    region: frankfurt # Low latency to Norway / Shopify Europe
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HELTHJEM_BASE_URL
        sync: false
      - key: HELTHJEM_SHOP_ID
        sync: false
      - key: HELTHJEM_CLIENT_ID
        sync: false
      - key: HELTHJEM_CLIENT_SECRET
        sync: false
      - key: HELTHJEM_TRANSPORT_SOLUTION_ID
        value: "2"
      - key: HELTHJEM_RATE_NAME
        value: "Helthjem - Hjemlevering | 1-3 virkedager"
      - key: HELTHJEM_RATE_CODE
        value: "helthjem_home"
      - key: HELTHJEM_RATE_DESCRIPTION
        value: "Helthjem standard home delivery"
      - key: HELTHJEM_RATE_PRICE
        value: "7900"
      - key: HELTHJEM_RATE_CURRENCY
        value: "NOK"
      - key: HELTHJEM_TIMEOUT_MS
        value: "4000"
      - key: ENABLE_TEST_ENDPOINT
        value: "true"
      - key: TEST_API_KEY
        sync: false
      - key: SHOPIFY_STORE_DOMAIN
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2026-07"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SHOPIFY_CARRIER_NAME
        value: "Helthjem Coverage"
